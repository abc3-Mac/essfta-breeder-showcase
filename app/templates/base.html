<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}ESSFTA Foundation Breeders&rsquo; Showcase{% endblock %}</title>
  <link rel="stylesheet" href="/static/showcase.css">
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <span class="badge">100 YEARS · 1926&ndash;2026</span>
      <div>
        <h1>ESSFTA Foundation Breeders&rsquo; Showcase</h1>
        <div class="sub">{{ SHOW_YEAR }} National Specialty</div>
      </div>
    </div>
    <nav>
      {% if user %}
        <a href="/dashboard">My Entries</a>
        {% if user.is_admin %}<a href="/admin">Admin</a>{% endif %}
        <a href="/logout">Sign out</a>
      {% endif %}
    </nav>
  </header>
  <main class="wrap">
    {% block body %}{% endblock %}
  </main>
</body>
</html>
